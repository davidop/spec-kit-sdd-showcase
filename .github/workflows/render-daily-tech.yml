name: Render Daily Tech video
on:
  workflow_dispatch:
    inputs:
      editorial_file:
        description: 'Committed, verified JSON: content/daily/YYYY-MM-DD.json'
        required: true
        type: string
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare and validate editorial input
        env:
          EDITORIAL_FILE: ${{ inputs.editorial_file }}
        run: |
          case "$EDITORIAL_FILE" in content/daily/*.json) ;; *) echo 'Invalid editorial file path'; exit 1;; esac
          node scripts/prepare-daily-props.mjs "$EDITORIAL_FILE" out/daily-props.json
      - name: Render vertical video
        run: npx remotion render src/index.ts DailyTech out/resumen-tech-diario.mp4 --props out/daily-props.json --codec h264 --pixel-format yuv420p
      - name: Inspect and validate MP4
        run: |
          test -s out/resumen-tech-diario.mp4
          ffprobe -v error -show_entries format=duration -show_entries stream=width,height,r_frame_rate,codec_name,pix_fmt -of json out/resumen-tech-diario.mp4
          python3 - <<'PY'
          import json,subprocess
          p='out/resumen-tech-diario.mp4'
          d=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',p]))
          v=next(s for s in d['streams'] if s['codec_type']=='video')
          assert (v['width'],v['height'],v['codec_name'],v['pix_fmt'],v['r_frame_rate'])==(1080,1920,'h264','yuv420p','30/1'),v
          assert abs(float(d['format']['duration'])-90)<.2
          print('PASS technical validation. Silent preview; narration and music NOT implemented.')
          PY
      - name: Upload video and editorial metadata
        uses: actions/upload-artifact@v4
        with:
          name: resumen-tech-diario-preview
          path: |
            out/resumen-tech-diario.mp4
            out/daily-props.json
          if-no-files-found: error
          retention-days: 14
