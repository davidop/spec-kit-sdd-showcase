name: Render animatic preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/render-preview.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg and ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Render preview
        run: npm run render
      - name: Inspect MP4 and validate output
        run: |
          test -s out/spec-kit-sdd-showcase.mp4
          ffprobe -v error -show_entries format=duration -show_entries stream=width,height,r_frame_rate,codec_name,pix_fmt -of json out/spec-kit-sdd-showcase.mp4
          python3 - <<'PY'
          import json, subprocess
          file = 'out/spec-kit-sdd-showcase.mp4'
          info = json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-show_entries','stream=width,height,r_frame_rate,codec_name,pix_fmt','-of','json',file],text=True))
          video = next(s for s in info['streams'] if s.get('width'))
          assert video['width']==1080 and video['height']==1920, video
          assert video['codec_name']=='h264', video
          assert video['pix_fmt']=='yuv420p', video
          assert video['r_frame_rate']=='30/1', video
          duration=float(info['format']['duration'])
          assert abs(duration-90)<0.2, duration
          print('PASS: 1080x1920, 30 fps, H.264, yuv420p, ~90 s')
          PY
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: spec-kit-sdd-animatic-preview
          path: out/spec-kit-sdd-showcase.mp4
          if-no-files-found: error
          retention-days: 14
