name: Render animatic preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/render-preview.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Render preview
        run: npm run render
      - name: Inspect MP4
        run: |
          ffprobe -v error -show_entries format=duration -show_entries stream=width,height,r_frame_rate,codec_name -of json out/spec-kit-sdd-showcase.mp4
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: spec-kit-sdd-animatic-preview
          path: out/spec-kit-sdd-showcase.mp4
          retention-days: 14
